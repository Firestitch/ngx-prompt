<button
    mat-flat-button
    color="primary"
    (click)="openAutocomplete()">
  Open Autocomplete
</button>
@if (selectAutoValue) {
  <div>
    <fieldset>
      <legend>
        Selected
      </legend>
      <ng-container>
        {{ selectAutoValue|json }}
      </ng-container>
    </fieldset>
  </div>
}
